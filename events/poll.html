<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <div class="bg-white rounded-lg shadow-md p-6 md:p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Event Feedback Form</h1>
            
            <form id="feedbackForm" class="space-y-8">
                <!-- Overall Experience -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">Please rate your overall experience of the event*</label>
                    <div class="flex flex-wrap gap-4">
                        <label class="inline-flex items-center">
                            <input type="radio" name="experience" value="Excellent" class="h-5 w-5 text-blue-600" required>
                            <span class="ml-2 text-gray-700">Excellent</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="experience" value="Good" class="h-5 w-5 text-blue-600">
                            <span class="ml-2 text-gray-700">Good</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="experience" value="Improvise" class="h-5 w-5 text-blue-600">
                            <span class="ml-2 text-gray-700">Improvise</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="experience" value="Unhappy" class="h-5 w-5 text-blue-600">
                            <span class="ml-2 text-gray-700">Unhappy</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="experience" value="Sad" class="h-5 w-5 text-blue-600">
                            <span class="ml-2 text-gray-700">Sad</span>
                        </label>
                    </div>
                </div>

                <!-- Speaker Rating -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">How would you rate the speaker of the event?</label>
                    <div class="flex justify-between max-w-md">
                        <label class="flex flex-col items-center">
                            <input type="radio" name="speaker_rating" value="1" class="h-5 w-5 text-blue-600">
                            <span class="mt-1 text-gray-700">1</span>
                        </label>
                        <label class="flex flex-col items-center">
                            <input type="radio" name="speaker_rating" value="2" class="h-5 w-5 text-blue-600">
                            <span class="mt-1 text-gray-700">2</span>
                        </label>
                        <label class="flex flex-col items-center">
                            <input type="radio" name="speaker_rating" value="3" class="h-5 w-5 text-blue-600">
                            <span class="mt-1 text-gray-700">3</span>
                        </label>
                        <label class="flex flex-col items-center">
                            <input type="radio" name="speaker_rating" value="4" class="h-5 w-5 text-blue-600">
                            <span class="mt-1 text-gray-700">4</span>
                        </label>
                        <label class="flex flex-col items-center">
                            <input type="radio" name="speaker_rating" value="5" class="h-5 w-5 text-blue-600">
                            <span class="mt-1 text-gray-700">5</span>
                        </label>
                    </div>
                </div>

                <!-- Open-ended questions -->
                <div class="space-y-6">
                    <div>
                        <label for="improvements" class="block text-gray-700 font-medium mb-2">What could we have done better?</label>
                        <textarea id="improvements" name="improvements" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    
                    <div>
                        <label for="least_interesting" class="block text-gray-700 font-medium mb-2">Which was the least interesting part of the event?</label>
                        <textarea id="least_interesting" name="least_interesting" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    
                    <div>
                        <label for="favorite_part" class="block text-gray-700 font-medium mb-2">Which was the favourite part of the event?</label>
                        <textarea id="favorite_part" name="favorite_part" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>

                <!-- Speakers to invite -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">Three speakers you would like us to invite to ENGAGE</label>
                    <div class="space-y-3">
                        <div>
                            <input type="text" name="speaker1" placeholder="01. Start typing here.." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <input type="text" name="speaker2" placeholder="02. Start typing here.." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <input type="text" name="speaker3" placeholder="03. Start typing here.." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Topics to address -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">Name three topics you would like us to address in our ENGAGE platform for all of you</label>
                    <div class="space-y-3">
                        <div>
                            <input type="text" name="topic1" placeholder="01. Start typing here.." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <input type="text" name="topic2" placeholder="02. Start typing here.." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <input type="text" name="topic3" placeholder="03. Start typing here.." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Yes/No questions -->
                <div class="space-y-6">
                    <div>
                        <label class="block text-gray-700 font-medium mb-3">Would you attend another event with us?</label>
                        <div class="flex gap-6">
                            <label class="inline-flex items-center">
                                <input type="radio" name="attend_again" value="Yes" class="h-5 w-5 text-blue-600">
                                <span class="ml-2 text-gray-700">Yes</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="attend_again" value="No" class="h-5 w-5 text-blue-600">
                                <span class="ml-2 text-gray-700">No</span>
                            </label>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-gray-700 font-medium mb-3">Can we contact you with further questions?</label>
                        <div class="flex gap-6">
                            <label class="inline-flex items-center">
                                <input type="radio" name="contact_me" value="Yes" class="h-5 w-5 text-blue-600">
                                <span class="ml-2 text-gray-700">Yes</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="contact_me" value="No" class="h-5 w-5 text-blue-600">
                                <span class="ml-2 text-gray-700">No</span>
                            </label>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-gray-700 font-medium mb-3">Was the event adequate timewise?</label>
                        <div class="flex gap-6">
                            <label class="inline-flex items-center">
                                <input type="radio" name="adequate_time" value="Yes" class="h-5 w-5 text-blue-600">
                                <span class="ml-2 text-gray-700">Yes</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="adequate_time" value="No" class="h-5 w-5 text-blue-600">
                                <span class="ml-2 text-gray-700">No</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Submit button -->
                <div class="pt-4">
                    <button type="submit" class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate required fields
            const experienceRating = document.querySelector('input[name="experience"]:checked');
            if (!experienceRating) {
                alert('Please rate your overall experience of the event');
                return;
            }
            
            // Collect form data
            const formData = {
                experience: experienceRating.value,
                speaker_rating: document.querySelector('input[name="speaker_rating"]:checked')?.value,
                improvements: document.getElementById('improvements').value,
                least_interesting: document.getElementById('least_interesting').value,
                favorite_part: document.getElementById('favorite_part').value,
                speakers: [
                    document.querySelector('input[name="speaker1"]').value,
                    document.querySelector('input[name="speaker2"]').value,
                    document.querySelector('input[name="speaker3"]').value
                ],
                topics: [
                    document.querySelector('input[name="topic1"]').value,
                    document.querySelector('input[name="topic2"]').value,
                    document.querySelector('input[name="topic3"]').value
                ],
                attend_again: document.querySelector('input[name="attend_again"]:checked')?.value,
                contact_me: document.querySelector('input[name="contact_me"]:checked')?.value,
                adequate_time: document.querySelector('input[name="adequate_time"]:checked')?.value
            };
            
            // Here you would typically send the data to a server
            console.log('Form submitted:', formData);
            
            // Show success message (in a real app, you might redirect or show a proper modal)
            alert('Thank you for your feedback!');
            this.reset();
        });
    </script>
</body>
</html>
