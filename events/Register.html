<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Know More</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</head>
<body class="bg-gray-100 font-sans">

  <div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Know More</h2>

    <form class="space-y-4">
      <div>
        <label for="fullname" class="block text-gray-700 font-semibold mb-1">Full Name</label>
        <input type="text" id="fullname" name="fullname" required class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring focus:border-blue-500">
      </div>

      <div>
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email ID</label>
        <input type="email" id="email" name="email" required class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring focus:border-blue-500">
      </div>

      <div>
        <label for="phone" class="block text-gray-700 font-semibold mb-1">Phone Number (WhatsApp)</label>
        <input type="tel" id="phone" name="phone" required class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring focus:border-blue-500">
      </div>

      <div>
        <label for="country" class="block text-gray-700 font-semibold mb-1">Country</label>
        <input type="text" id="country" name="country" required class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring focus:border-blue-500">
      </div>

      <!-- Payment Options -->
<div>
  <label class="block text-gray-700 font-semibold mb-2">Payment Method</label>
  <div class="space-y-4">

    <!-- UPI Option -->
    <div class="flex items-center space-x-3">
      <input type="radio" id="upi" name="payment" value="upi" class="text-blue-600" checked>
      <label for="upi" class="flex items-center space-x-2 cursor-pointer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Unified_Payments_Interface_logo.svg" alt="UPI" class="h-6 w-auto">
        <span>UPI (Google Pay / PhonePe / Paytm)</span>
      </label>
    </div>

    <!-- Credit/Debit Card Option -->
    <div class="flex items-center space-x-3">
      <input type="radio" id="card" name="payment" value="card" class="text-blue-600">
      <label for="card" class="flex items-center space-x-2 cursor-pointer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" alt="Visa" class="h-5">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Mastercard_2019_logo.svg" alt="Mastercard" class="h-5">
        <span>Credit / Debit Card</span>
      </label>
    </div>

    <!-- Paytm -->
    <div class="flex items-center space-x-3">
      <input type="radio" id="paytm" name="payment" value="paytm" class="text-blue-600">
      <label for="paytm" class="flex items-center space-x-2 cursor-pointer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Paytm_logo.png" alt="Paytm" class="h-6 w-auto">
        <span>Paytm Wallet</span>
      </label>
    </div>

    <!-- CRED -->
    <div class="flex items-center space-x-3">
      <input type="radio" id="cred" name="payment" value="cred" class="text-blue-600">
      <label for="cred" class="flex items-center space-x-2 cursor-pointer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/59/CRED_Logo.png" alt="Cred" class="h-6">
        <span>Cred Pay</span>
      </label>
    </div>

  </div>
</div>


     <button
  id="rzp-button"
  type="button"
  class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow w-full"
>
  Pay Now
</button>

      </div>
    </form>
  </div>
<script>
  var options = {
    "key": "rzp_test_YourAPIKeyHere", // Replace with your Razorpay API Key
    "amount": 50000, 
    "currency": "INR",
    "name": "Alliance University",
    "description": "Know More Registration Fee",
    "image": "https://your-logo-url.com/logo.png",
    "handler": function (response){
        alert("Payment successful. Payment ID: " + response.razorpay_payment_id);
        
    },
    "prefill": {
        "name": "Your User's Name",
        "email": "user@example.com",
        "contact": "9999999999"
    },
    "theme": {
        "color": "#003366"
    }
  };

  var rzp1 = new Razorpay(options);
  document.getElementById('rzp-button').onclick = function(e){
    rzp1.open();
    e.preventDefault();
  }
</script>
</body>
</html>
